services:
  db:
    image: postgres:17-alpine
    container_name: belegpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: belegpilot
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d belegpilot"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No ports: — DB is only reachable on the internal Docker network.

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: belegpilot-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=belegpilot;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: BelegPilot
      Jwt__Audience: BelegPilot
      Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_EXPIRY_MINUTES:-60}
      Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_EXPIRY_DAYS:-30}
      RefreshToken__HashKey: ${REFRESHTOKEN_HASHKEY}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY}
      Anthropic__Model: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      Anthropic__MaxTokens: ${ANTHROPIC_MAX_TOKENS:-1024}
      Anthropic__CostPerClassification: ${ANTHROPIC_COST_PER_CLASSIFICATION:-1}
      Sentry__Dsn: ${SENTRY_DSN_BACKEND:-}
      Sentry__Environment: production
      Hangfire__SeedAdminEmails: ${HANGFIRE_SEEDADMINEMAILS:-}
      Tesseract__PoolSize: ${TESSERACT_POOLSIZE:-3}
      RUN_MIGRATIONS: "true"
      UploadStorage__Path: /var/lib/taxreader/uploads
      Stripe__SecretKey: ${Stripe__SecretKey}
      Stripe__PublishableKey: ${Stripe__PublishableKey}
      Stripe__WebhookSecret: ${Stripe__WebhookSecret}
      Stripe__DemoMode: ${Stripe__DemoMode:-false}
      Stripe__AppBaseUrl: ${Stripe__AppBaseUrl:-http://localhost:3000}
    volumes:
      - taxreader_uploads:/var/lib/taxreader/uploads
    # No ports: — API is only reachable via the web container.

  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: belegpilot-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://api:8080
      NEXT_PUBLIC_SENTRY_ENABLED: ${NEXT_PUBLIC_SENTRY_ENABLED:-false}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    # No ports: — traffic enters only through Caddy.

  caddy:
    image: caddy:2-alpine
    container_name: belegpilot-caddy
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}

  backup:
    image: alpine:3.20
    container_name: belegpilot-backup
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - taxreader_uploads:/uploads:ro
      - ./scripts/backup.sh:/backup.sh:ro
    environment:
      AWS_ACCESS_KEY_ID: ${B2_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${B2_APP_KEY}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      HEALTHCHECKS_BACKUP_URL: ${HEALTHCHECKS_BACKUP_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache restic postgresql-client curl && crond -f -d 8"]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  taxreader_uploads:
